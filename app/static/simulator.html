<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queue Pro Bot Simulator</title>
<style>
  :root { --bg:#efe7dd; --bar:#075e54; --me:#d9fdd3; --bot:#fff; --text:#111b21; --muted:#667781; --link:#027eb5; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background:#d1d7db; color:var(--text); }
  .phone { max-width:480px; height:100vh; margin:0 auto; display:flex; flex-direction:column; background:var(--bg); position:relative; }
  header { background:var(--bar); color:#fff; padding:10px 14px; display:flex; gap:10px; align-items:center; }
  header .name { font-weight:600; } header .sub { font-size:12px; opacity:.8; }
  header input { margin-left:auto; width:140px; border:0; border-radius:6px; padding:4px 6px; font-size:12px; }
  #log { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:6px; }
  .msg { max-width:85%; padding:6px 9px; border-radius:8px; box-shadow:0 1px .5px rgba(0,0,0,.13); white-space:pre-wrap; word-wrap:break-word; }
  .bot { background:var(--bot); align-self:flex-start; } .me { background:var(--me); align-self:flex-end; }
  .hdr { font-weight:600; margin-bottom:2px; } .ftr { color:var(--muted); font-size:12px; margin-top:4px; }
  .actions { border-top:1px solid #e9edef; margin:6px -9px -6px; display:flex; flex-direction:column; }
  .actions button { background:none; border:0; border-top:1px solid #e9edef; color:var(--link); padding:9px; font-size:14px; cursor:pointer; }
  .actions button:first-child { border-top:0; } .actions button:disabled { color:var(--muted); cursor:default; }
  .msg img { width:100%; border-radius:6px; display:block; margin-bottom:4px; }
  form { display:flex; gap:8px; padding:8px; background:#f0f2f5; }
  form input { flex:1; border:0; border-radius:20px; padding:10px 14px; font-size:15px; }
  form button { border:0; border-radius:50%; width:42px; background:#00a884; color:#fff; font-size:18px; cursor:pointer; }
  .sheet { position:absolute; inset:0; background:rgba(0,0,0,.35); display:none; align-items:flex-end; }
  .sheet.open { display:flex; }
  .sheet .panel { background:#fff; width:100%; border-radius:14px 14px 0 0; max-height:75%; overflow-y:auto; padding:8px 0; }
  .sheet .title { text-align:center; font-weight:600; padding:8px; border-bottom:1px solid #e9edef; }
  .row { padding:10px 18px; border-bottom:1px solid #f0f2f5; cursor:pointer; } .row:hover { background:#f5f6f6; }
  .row .d { color:var(--muted); font-size:13px; }
  .typing { color:var(--muted); font-size:12px; align-self:flex-start; }
</style>
</head>
<body>
<div class="phone">
  <header>
    <div><div class="name">BRAC Bank Queue Pro</div><div class="sub">Local simulator - same engine as the webhook</div></div>
    <input id="waid" value="8801700000000" title="Simulated sender number">
  </header>
  <div id="log"></div>
  <form id="f"><input id="t" placeholder="Type a message (try: Hi)" autocomplete="off"><button>➤</button></form>
  <div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
</div>
<script>
const log = document.getElementById('log'), sheet = document.getElementById('sheet'), panel = document.getElementById('panel');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s || '').replace(/\*([^*\n]+)\*/g, '<b>$1</b>');
const scroll = () => log.scrollTop = log.scrollHeight;

function bubble(cls, html) { const d = document.createElement('div'); d.className = 'msg ' + cls; d.innerHTML = html; log.appendChild(d); scroll(); return d; }

async function send(body, label) {
  bubble('me', fmt(label));
  const typing = document.createElement('div'); typing.className = 'typing'; typing.textContent = 'typing…'; log.appendChild(typing); scroll();
  try {
    const r = await fetch('/dev/simulate', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ wa_id: document.getElementById('waid').value, ...body }) });
    const data = await r.json();
    typing.remove();
    (data.messages || []).forEach(render);
  } catch (e) { typing.remove(); bubble('bot', 'Error: ' + esc(String(e))); }
}

function render(m) {
  if (m.type === 'text') return bubble('bot', fmt(m.text.body));
  if (m.type === 'image') return bubble('bot', `<img src="${m.image.url}" alt="token">${fmt(m.image.caption)}`);
  const i = m.interactive;
  const d = bubble('bot', (i.header ? `<div class="hdr">${fmt(i.header.text)}</div>` : '') + fmt(i.body.text) +
                          (i.footer ? `<div class="ftr">${fmt(i.footer.text)}</div>` : ''));
  const actions = document.createElement('div'); actions.className = 'actions'; d.appendChild(actions);
  if (i.type === 'list') {
    const b = document.createElement('button'); b.textContent = '☰ ' + i.action.button; actions.appendChild(b);
    b.onclick = () => openList(i.action);
  } else if (i.type === 'button') {
    i.action.buttons.forEach(({reply}) => {
      const b = document.createElement('button'); b.textContent = reply.title; actions.appendChild(b);
      b.onclick = () => send({ reply_id: reply.id, reply_title: reply.title }, reply.title);
    });
  }
}

function openList(action) {
  panel.innerHTML = `<div class="title">${esc(action.button)}</div>`;
  action.sections.forEach(sec => sec.rows.forEach(row => {
    const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = `<div>${esc(row.title)}</div>` + (row.description ? `<div class="d">${esc(row.description)}</div>` : '');
    r.onclick = () => { sheet.classList.remove('open'); send({ reply_id: row.id, reply_title: row.title }, row.title); };
    panel.appendChild(r);
  }));
  sheet.classList.add('open');
}
sheet.onclick = e => { if (e.target === sheet) sheet.classList.remove('open'); };

document.getElementById('f').onsubmit = e => {
  e.preventDefault(); const t = document.getElementById('t'); const v = t.value.trim();
  if (v) { send({ text: v }, v); t.value = ''; }
};
</script>
</body>
</html>
